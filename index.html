    .menu-lateral { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: rgba(10,15,29,0.95); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.1); z-index: 10000; transition: left 0.3s ease; display: flex; flex-direction: column; }

    .menu-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .menu-header h2 { font-size: 1.1rem; font-weight: 600; color: white; }
    .btn-fechar { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
    .lista-canais { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .item-canal { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.1s; }
    .item-canal.ativo { background: rgba(2,132,199,0.3); border-left: 3px solid #0284c7; }
    .capa-canal { width: 36px; height: 28px; background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .info-canal h3 { font-size: 0.85rem; font-weight: 500; color: white; }

    let player = null;
    let canalAtual = null;
    let timerAviso = null;

    function init() {
      renderizarLista();
      if (listaCanais.length) abrirCanal(listaCanais[0].id);
      configurarEventos();
      bloquearAnuncios();
    }

    function renderizarLista() {
      const container = document.getElementById('listaCanais');
      if (!container) return;
      let html = '';
      listaCanais.forEach(c => {
        html += `
          <div class="item-canal" data-id="${c.id}">
            <div class="capa-canal"><img src="${c.logo}" loading="lazy" onerror="this.src='${LOGO_PADRAO}'"></div>
            <div class="info-canal"><h3>${c.nome}</h3></div>
          </div>
        `;
      });
      container.innerHTML = html;
      document.querySelectorAll('.item-canal').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          if (id) abrirCanal(id);
          fecharMenu();
        });
      });
    }

    function destacarCanalAtivo(id) {
      document.querySelectorAll('.item-canal').forEach(el => {
        el.classList.remove('ativo');
        if (el.getAttribute('data-id') === id) el.classList.add('ativo');
      });
    }

    function abrirCanal(id) {
      const canal = listaCanais.find(c => c.id === id);
      if (!canal) return;
      canalAtual = canal;
      destacarCanalAtivo(id);
      mostrarAviso(canal.nome);
      reproduzirVideo(canal.url);
    }

    function reproduzirVideo(url) {
      if (player) { player.destroy(); player = null; }
      const container = document.getElementById('playerDestino');
      if (!container) return;
      container.innerHTML = '';
      if (url.includes('.m3u8')) {
        const div = document.createElement('div');
        div.id = 'reprodutor-clappr';
        container.appendChild(div);
        player = new Clappr.Player({
          source: url,
          parentId: '#reprodutor-clappr',
          width: '100%',
          height: '100%',
          autoPlay: true,
          preload: 'auto',
          playback: {
            playInline: true,
            hlsMinimumClusterDuration: 0.05,
            liveSyncDurationCount: 2,
            maxBufferLength: 2
          }
        });
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('allow', 'autoplay; fullscreen');
        container.appendChild(iframe);
      }
    }

    function mostrarAviso(msg) {
      const el = document.getElementById('avisoCanal');
      if (!el) return;
      clearTimeout(timerAviso);
      el.innerText = msg;
      el.classList.add('mostrar');
      timerAviso = setTimeout(() => el.classList.remove('mostrar'), 1500);
    }

    function limparCache() {
      if (!canalAtual) return;
      mostrarAviso('Limpando cache...');
      let url = canalAtual.url;
      const sep = url.includes('?') ? '&' : '?';
      url += sep + 'nocache=' + Date.now();
      if (player) { player.destroy(); player = null; }
      setTimeout(() => {
        reproduzirVideo(url);
        mostrarAviso(canalAtual.nome + ' (cache limpo)');
      }, 400);
    }

    function proximoCanal() {
      const idx = listaCanais.findIndex(c => c.id === canalAtual.id);
      const next = listaCanais[(idx + 1) % listaCanais.length];
      abrirCanal(next.id);
    }

    function canalAnterior() {
      const idx = listaCanais.findIndex(c => c.id === canalAtual.id);
      const prev = listaCanais[(idx - 1 + listaCanais.length) % listaCanais.length];
      abrirCanal(prev.id);
    }

    function embaralharCanais() {
      for (let i = listaCanais.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [listaCanais[i], listaCanais[j]] = [listaCanais[j], listaCanais[i]];
      }
      renderizarLista();
      const aleatorio = listaCanais[Math.floor(Math.random() * listaCanais.length)];
      abrirCanal(aleatorio.id);
      mostrarAviso('Canais embaralhados!');
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }

    function configurarEventos() {
      document.getElementById('btnAnterior')?.addEventListener('click', canalAnterior);
      document.getElementById('btnProximo')?.addEventListener('click', proximoCanal);
      document.getElementById('btnLimpar')?.addEventListener('click', limparCache);
      document.getElementById('btnTelaCheia')?.addEventListener('click', toggleFullScreen);
      document.getElementById('btnEmbaralhar')?.addEventListener('click', embaralharCanais);
      document.getElementById('btnMenu')?.addEventListener('click', toggleMenu);
      document.getElementById('btnFecharMenu')?.addEventListener('click', fecharMenu);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') { e.preventDefault(); canalAnterior(); }
        if (e.key === 'ArrowDown') { e.preventDefault(); proximoCanal(); }
        if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullScreen(); }
      });
    }

    function toggleMenu() {
      document.getElementById('menuLateral')?.classList.toggle('aberto');
    }
    function fecharMenu() {
      document.getElementById('menuLateral')?.classList.remove('aberto');
    }

    function bloquearAnuncios() {
      const observer = new MutationObserver(() => {
        document.querySelectorAll('iframe[src*="doubleclick"], iframe[src*="googlesyndication"], div[class*="ad-"], div[id*="ad-"]').forEach(el => el.remove());
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setInterval(() => {
        document.querySelectorAll('iframe[src*="doubleclick"], iframe[src*="googlesyndication"]').forEach(el => el.remove());
      }, 3000);
    }

    init();
  </script>
